name: Android checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check tracked files for secrets
        shell: bash
        run: |
          if git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AIza[0-9A-Za-z_-]{20,}'; then
            echo 'Potential secret found in tracked files.'
            exit 1
          fi
          if test -f keystore.properties; then
            echo 'keystore.properties must never be committed or present in CI.'
            exit 1
          fi

      - name: Run unit tests, lint, debug build and unsigned release bundle
        run: ./gradlew clean test lint assembleDebug bundleRelease --no-daemon
